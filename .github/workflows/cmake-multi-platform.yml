name: Endless Meadow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install raylib cmake

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Zip macOS app
        run: |
          cd build
          zip -r EndlessMeadow-macOS.zip EndlessMeadow.app

      - uses: actions/upload-artifact@v4
        with:
          name: EndlessMeadow-macOS
          path: build/EndlessMeadow-macOS.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ git make \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build and install raylib
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cmake -S raylib -B raylib/build -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build raylib/build --target install

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package Linux build
        run: |
          cd build
          zip -r EndlessMeadow-Linux.zip EndlessMeadow

      - uses: actions/upload-artifact@v4
        with:
          name: EndlessMeadow-Linux
          path: build/EndlessMeadow-Linux.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and install raylib
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cmake -S raylib -B raylib/build -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build raylib/build --config Release
          cmake --install raylib/build --config Release --prefix "$env:GITHUB_WORKSPACE/raylib-install"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/raylib-install"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/* -DestinationPath build/EndlessMeadow-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EndlessMeadow-Windows
          path: build/EndlessMeadow-Windows.zip
